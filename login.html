<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookSwap</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
    <style>
        body {
            font-family: sans-serif;
            background-color: #4e2804;
            margin: 0;
            padding: 0;
        }
        #login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: rgb(214, 180, 147);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-container form {
            display: flex;
            flex-direction: column;
        }
        .login-container label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #3a1c0e;
        }
        .login-container input {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-btn {
            padding: 12px;
            background-color: #3a1c0e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background-color: #5a2d16;
        }
        .signup-btn {
            padding: 12px;
            margin-top: 10px;
            background-color: transparent;
            color: #3a1c0e;
            border: 1px solid #3a1c0e;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .switch-link {
            text-align: center;
            margin-top: 15px;
        }
        .switch-link a {
            color: #3a1c0e;
            font-weight: 600;
            text-decoration: none;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: #3a1c0e;
            font-size: 14px;
        }
        .back-link i {
            margin-right: 5px;
        }
        .error {
            color: #d93025;
            font-weight: 600;
            font-size: 13px;
            margin-top: -15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="login-wrapper">
        <div class="login-container">
            <a href="index.html" class="back-link"><i class="ri-arrow-left-line"></i> Back to Home</a>
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Enter your email" required />
                <div class="error" id="emailError"></div>

                <label for="password">Password (min. 6 characters)</label>
                <input type="password" id="password" placeholder="Enter your password" required minlength="6" />
                <div class="error" id="passwordError"></div>

                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="switch-link">
                <a href="signup.html">Don't have an account? Sign Up</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            emailError.textContent = '';
            passwordError.textContent = '';
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
                alert("Login Successful!");
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Login Error:", error.code, error.message);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email' || error.code === 'auth/invalid-credential') {
                    emailError.textContent = "Invalid email or password.";
                } else {
                    emailError.textContent = "An error occurred. Please try again.";
                }
            }
        });
    </script>
</body>
</html>
