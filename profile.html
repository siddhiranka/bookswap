<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BookSwap</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <nav id="navbar">
        <div id="navleft">
            <a href="dashboard.html"><i class="ri-arrow-left-line"></i> Back to Dashboard</a>
        </div>
        <div id="navright">
            <a href="dashboard.html" style="color: white;">My Profile</a>
        </div>
    </nav>

    <div class="library-container" style="padding-top: 15vh;">
        <div class="add-book-section">
            <h2>Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="displayName" required>
                </div>
                <div class="form-group">
                    <label>Email (Read Only)</label>
                    <input type="email" id="email" disabled style="background: #eee;">
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <textarea id="address" rows="4" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ddd;" placeholder="Enter your full address for book delivery"></textarea>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Optional">
                </div>
                <button type="submit" class="submit-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const profileForm = document.getElementById('profileForm');
        const nameInput = document.getElementById('displayName');
        const emailInput = document.getElementById('email');
        const addressInput = document.getElementById('address');
        const phoneInput = document.getElementById('phone');
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                nameInput.value = user.displayName || "";
                emailInput.value = user.email || "";

                // Load extra data from Firestore
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    addressInput.value = data.address || "";
                    phoneInput.value = data.phone || "";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                // Update Auth Profile
                if (nameInput.value !== currentUser.displayName) {
                    await updateProfile(currentUser, { displayName: nameInput.value });
                }

                // Update Firestore Data
                await setDoc(doc(db, "users", currentUser.uid), {
                    address: addressInput.value,
                    phone: phoneInput.value,
                    email: currentUser.email
                }, { merge: true });

                alert("Profile updated successfully!");
            } catch (error) {
                console.error(error);
                alert("Error updating profile.");
            }
        });
    </script>
</body>
</html>
